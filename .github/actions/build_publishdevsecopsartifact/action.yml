name: Build_PublishDevsecopsArtifact
inputs:
  reportfolder:
    required: false
    default: "$(reportfolder)"
    type: string
runs:
  using: composite
  steps:
  - name: Publish Report
    uses: actions/upload-artifact@v4.1.0
    with:
      name: owsap
      path: " ${{ runner.temp }}/${{ env.reportfolder }}"